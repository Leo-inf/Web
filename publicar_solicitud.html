<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Publicar Solicitud de Empleo</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
     <!-- Cabecera -->
  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda-y-botones">
      <input type="text" placeholder="Buscar..." />
      <a href="login.html" class="btn-header">Iniciar Sesión</a>
    </div>
    <div class="menu">
      <button class="btmenu">
        <div></div>
        <div></div>
        <div></div>
      </button> 
              <ul class="opciones">       
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="publicar_solicitud.html">Publicar Solicitud</a></li>
                <li><a href="panel_empresario.html">Mi Panel</a></li>
                <li><a href="bolsa_trabajo.html">Ver Ofertas</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="ayuda.html">Ayuda</a></li>
                <li><a href="logout.html">Cerrar Sesión</a></li>
             </ul> 
    </div>
  </header>

    <!-- Contenido principal -->
<main class="contenedor login-registro">
    <div class="form-container">
      <h2>Publicar Solicitud de Empleo</h2>
      <form action="#" method="post">
        <label>Título del Puesto:</label>
        <input type="text" name="titulo" required />

        <label>Descripción del Puesto:</label>
        <textarea name="descripcion" required></textarea>

        <label>Requisitos:</label>
        <textarea name="requisitos" required></textarea>

        <label>Modalidad:</label>
        <select name="modalidad">
          <option value="presencial">Presencial</option>
          <option value="remoto">Remoto</option>
          <option value="hibrido">Híbrido</option>
        </select>

        <label>Ubicación:</label>
        <input type="text" name="ubicacion" required />

        <label>Sueldo estimado (opcional):</label>
        <input type="text" name="sueldo" />

        <label>Correo de contacto:</label>
        <input type="email" name="contacto" required />

        <button type="submit">Publicar</button>
      </form>
    </div>
  </main>
</body>
<script>
  const menuToggle = document.querySelector(".btmenu");
  const menuOpciones = document.querySelector(".opciones");

  menuToggle.addEventListener("click", () => {
    menuOpciones.style.display =
      menuOpciones.style.display === "block" ? "none" : "block";
  });

  window.addEventListener("click", (e) => {
    if (!menuToggle.contains(e.target) && !menuOpciones.contains(e.target)) {
      menuOpciones.style.display = "none";
    }
  });
</script>
