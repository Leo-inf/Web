<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión - Nombre de la Página</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda">
      <input type="text" placeholder="Buscar..." />
    </div>
  </header>

  <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Iniciar Sesión</h2>
      <form action="#" method="post">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Entrar</button>
      </form>
      <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
  </main>

</body>
</html>
