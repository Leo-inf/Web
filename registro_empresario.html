<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro Empresario</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda">
      <input type="text" placeholder="Buscar..." />
    </div>
    <div class="menu">
      <button class="btmenu">
        <div></div>
        <div></div>
        <div></div>
      </button> 
              <ul class="opciones">       
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="publicar_solicitud.html">Publicar Solicitud</a></li>
                <li><a href="panel_empresario.html">Mi Panel</a></li>
                <li><a href="bolsa_trabajo.html">Ver Ofertas</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="ayuda.html">Ayuda</a></li>
                <li><a href="terminos.html">Términos y Condiciones</a></li>
                <li><a href="politica_privacidad.html">Política de Privacidad</a></li>
                <li><a href="logout.html">Cerrar Sesión</a></li>
             </ul> 
    </div>
  </header>

<main class="contenedor login-registro">
    <div class="form-container">
      <h2>Registro para Empresarios</h2>
      <form action="#" method="post" enctype="multipart/form-data">
        <label for="nombre">Nombre del representante:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="empresa">Nombre de la empresa:</label>
        <input type="text" id="empresa" name="empresa" required />

        <label for="ruc">RUC / CIF:</label>
        <input type="text" id="ruc" name="ruc" required />

        <label for="telefono">Teléfono de contacto:</label>
        <input type="tel" id="telefono" name="telefono" required />

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" required />

        <label for="sector">Sector / Rubro:</label>
        <input type="text" id="sector" name="sector" required />

        <label for="web">Sitio web:</label>
        <input type="url" id="web" name="web" placeholder="https://ejemplo.com" />

        <label for="logo">Logo de la empresa:</label>
        <input type="file" id="logo" name="logo" accept="image/*" />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Registrarse como Empresario</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
  </main>
</body>
<script>
  const menuToggle = document.querySelector(".btmenu");
  const menuOpciones = document.querySelector(".opciones");

  menuToggle.addEventListener("click", () => {
    menuOpciones.style.display =
      menuOpciones.style.display === "block" ? "none" : "block";
  });

  window.addEventListener("click", (e) => {
    if (!menuToggle.contains(e.target) && !menuOpciones.contains(e.target)) {
      menuOpciones.style.display = "none";
    }
  });
</script>
</html>
