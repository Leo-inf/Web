<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda-y-botones">
      <input type="text" placeholder="Buscar..." />
      <a href="login.html" class="btn-header">Iniciar Sesión</a>
    </div>
  </header>

  <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Editar Perfil</h2>
      <form action="#" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" value="Chivita" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" value="Sal.de.hay@example.com" required />

        <button type="submit">Guardar Cambios</button>
      </form>
      <p><a href="perfil.html">Volver al perfil</a></p>
    </div>
  </main>

</body>
</html>
