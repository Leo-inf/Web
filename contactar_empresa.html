<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contactar Empresa</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Cabecera -->
   <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda-y-botones">
      <input type="text" placeholder="Buscar..." />
      <a href="login.html" class="btn-header">Iniciar Sesión</a>
    </div>
    <div class="menu">
      <button class="btmenu">
        <div></div>
        <div></div>
        <div></div>
      </button> 
              <ul class="opciones">       
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="publicar_solicitud.html">Publicar Solicitud</a></li>
                <li><a href="panel_empresario.html">Mi Panel</a></li>
                <li><a href="bolsa_trabajo.html">Ver Ofertas</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="ayuda.html">Ayuda</a></li>
                <li><a href="logout.html">Cerrar Sesión</a></li>
             </ul> 
    </div>

  </header>

  <!-- Contenido principal -->

  <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Contactar Empresa</h2>
      <form action="#" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <label for="cv">Adjuntar CV (URL o texto):</label>
        <input type="text" id="cv" name="cv" placeholder="https://drive.google.com/...">

        <button type="submit">Enviar Mensaje</button>
      </form>
    </div>
  </main>
</body>
<script>
  const menuToggle = document.querySelector(".btmenu");
  const menuOpciones = document.querySelector(".opciones");

  menuToggle.addEventListener("click", () => {
    menuOpciones.style.display =
      menuOpciones.style.display === "block" ? "none" : "block";
  });

  window.addEventListener("click", (e) => {
    if (!menuToggle.contains(e.target) && !menuOpciones.contains(e.target)) {
      menuOpciones.style.display = "none";
    }
  });
</script>

        </li>

</footer>
</html>
