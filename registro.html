<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro - Nombre de la Página</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda">
      <input type="text" placeholder="Buscar..." />
    </div>
  </header>
  
 <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Registro</h2>
      <form action="#" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />

        <label for="password2">Confirmar contraseña:</label>
        <input type="password" id="password2" name="password2" required />

        <label class="checkbox-label">
          <input type="checkbox" id="empresario" /> Soy empresario
        </label>

        <button type="submit">Registrarse</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
  </main>

  <script>
    document.getElementById('empresario').addEventListener('change', function () {
      if (this.checked) {
        window.location.href = 'registro_empresario.html';
      }
    });
  </script>

</body>
</html>
