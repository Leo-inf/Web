<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro - Nombre de la Página</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda">
      <input type="text" placeholder="Buscar..." />
    </div>
    <div class="menu">
      <button class="btmenu">
        <div></div>
        <div></div>
        <div></div>
      </button> 
              <ul class="opciones">       
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="publicar_solicitud.html">Publicar Solicitud</a></li>
                <li><a href="panel_empresario.html">Mi Panel</a></li>
                <li><a href="bolsa_trabajo.html">Ver Ofertas</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="ayuda.html">Ayuda</a></li>
                <li><a href="terminos.html">Términos y Condiciones</a></li>
                <li><a href="politica_privacidad.html">Política de Privacidad</a></li>
                <li><a href="logout.html">Cerrar Sesión</a></li>
             </ul> 
    </div>
  </header>
  
 <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Registro</h2>
      <form action="#" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required />

        <label for="password2">Confirmar contraseña:</label>
        <input type="password" id="password2" name="password2" required />

        <div class="terminos-checkbox">
          <input type="checkbox" id="aceptar" required>
          <label for="aceptar">
            Acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a>
          </label>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="empresario" /> Soy empresario
        </label>

        <button type="submit">Registrarse</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
  </main>

  <script>
    //check empreasrio
    document.getElementById('empresario').addEventListener('change', function () {
      if (this.checked) {
        window.location.href = 'registro_empresario.html';
      }
    });

    // script menu
  const menuToggle = document.querySelector(".btmenu");
  const menuOpciones = document.querySelector(".opciones");

  menuToggle.addEventListener("click", () => {
    menuOpciones.style.display =
      menuOpciones.style.display === "block" ? "none" : "block";
  });

  window.addEventListener("click", (e) => {
    if (!menuToggle.contains(e.target) && !menuOpciones.contains(e.target)) {
      menuOpciones.style.display = "none";
    }
  });
  
  </script>

</body>
</html>
