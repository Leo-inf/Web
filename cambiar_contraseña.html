<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cambiar Contraseña</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="https://i.ibb.co/F95qJHn/Logo.png" alt="Logo de la página" class="logo"></a>
    <div class="nombre-pagina">Chivita Recomienda</div>
    <div class="busqueda-y-botones">
      <input type="text" placeholder="Buscar..." />
      <a href="login.html" class="btn-header">Iniciar Sesión</a>
    </div>
  </header>

  <main class="contenedor login-registro">
    <div class="form-container">
      <h2>Cambiar Contraseña</h2>
      <form action="#" method="post">
        <label for="actual">Contraseña actual:</label>
        <input type="password" id="actual" name="actual" required />

        <label for="nueva">Nueva contraseña:</label>
        <input type="password" id="nueva" name="nueva" required />

        <label for="confirmar">Confirmar nueva contraseña:</label>
        <input type="password" id="confirmar" name="confirmar" required />

        <button type="submit">Actualizar Contraseña</button>
      </form>
      <p><a href="perfil.html">Volver al perfil</a></p>
    </div>
  </main>

</body>
</html>
